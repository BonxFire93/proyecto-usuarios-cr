<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nimbus Retail Corp - Usuarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <h1>Usuarios registrados</h1>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Correo</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.apellido }}</td>
                <td>{{ usuario.mail }}</td>
                <td>{{ usuario.edad }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{{ url_for('crear_usuario_form') }}">➕ Crear nuevo usuario</a>
</body>
</html>
